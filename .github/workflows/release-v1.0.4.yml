name: Release v1.0.4

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v1.0.4.yml"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller==6.16.0

      - name: Static Python check
        run: python -m compileall -q build_vanilla_overlay.py build_video_subtitles.py

      - name: Build standalone installer
        run: pyinstaller --noconfirm --clean OblivionKRBuilder.spec

      - name: Package v1.0.4
        shell: pwsh
        run: |
          $package = "release\Oblivion_Original_KR_Installer_v1.0.4"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "dist\OblivionKRBuilder.exe" "$package\OblivionKRBuilder.exe"
          Copy-Item "install.bat" "$package\install.bat"
          Copy-Item "README.md" "$package\README.md"
          Compress-Archive -Path "$package\*" -DestinationPath "Oblivion_Original_KR_Installer_v1.0.4.zip" -Force
          $hash = (Get-FileHash "Oblivion_Original_KR_Installer_v1.0.4.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content "release_notes_v1.0.4.md" ""
          Add-Content "release_notes_v1.0.4.md" "SHA-256: `$hash`"
          Write-Host "Release SHA-256: $hash"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.4 "Oblivion_Original_KR_Installer_v1.0.4.zip" --target "${{ github.sha }}" --title "Oblivion Original 한국어 번역 v1.0.4" --notes-file "release_notes_v1.0.4.md"
